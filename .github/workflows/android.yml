name: Android build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GravityDefied-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
          ls -lh artifacts/GravityDefied-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GravityDefied-Android-debug
          path: artifacts/GravityDefied-debug.apk
          if-no-files-found: error
          retention-days: 30
